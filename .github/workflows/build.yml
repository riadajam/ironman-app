name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache libffi-dev libssl-dev build-essential ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixin-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev openjdk-17-jdk unzip zip
        pip install --upgrade pip setuptools buildozer kivy==2.2.1 Cython

    - name: Build with Buildozer
      run: |
        buildozer init
        sed -i 's/package.name = myapp/package.name = ironmanapp/' buildozer.spec
        sed -i 's/package.domain = org.test/package.domain = org.ironman/' buildozer.spec
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy==2.2.1/' buildozer.spec
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: IronmanApp-APK
        path: bin/*.apk
